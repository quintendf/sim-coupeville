<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coupeville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--panel:rgba(22,24,28,.86);--panel-b:#3a4046;--ink:#ece8dc;--muted:#a19d92;--accent:#7fb0dc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1114;color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:13px;overflow:hidden}
#game{position:fixed;inset:0}
#game canvas{display:block}
.hud{position:fixed;pointer-events:none;font:500 12px "IBM Plex Mono",monospace;color:var(--ink);text-shadow:0 1px 2px #000}
#title{left:14px;top:12px;font:600 15px "Source Sans 3",sans-serif;letter-spacing:.02em}
#title small{display:block;font:400 11px "IBM Plex Mono",monospace;color:var(--muted);margin-top:2px}
#clock{right:14px;top:12px;text-align:right;font-size:16px}
#clock small{display:block;font-size:11px;color:var(--muted)}
#hint{left:50%;bottom:12px;transform:translateX(-50%);color:var(--muted);font-size:11px;background:var(--panel);border:1px solid var(--panel-b);border-radius:999px;padding:3px 12px;white-space:nowrap}
#status{left:14px;bottom:12px;color:var(--muted);font-size:11px}
#card{position:fixed;left:14px;top:64px;max-width:280px;background:var(--panel);border:1px solid var(--panel-b);border-left:3px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.4;backdrop-filter:blur(6px)}
#card b{display:block;font-size:14px}
#card .sub{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px;margin-top:4px}
#card button{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer}
#debug{position:fixed;right:14px;bottom:12px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--panel-b);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--muted)}
#debug input[type=range]{width:140px;accent-color:var(--accent)}
#debug button{font:inherit;background:#2a2e33;color:var(--ink);border:1px solid var(--panel-b);border-radius:4px;padding:2px 8px;cursor:pointer}
#debug button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#101418}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#0e1114;color:var(--muted);font:12px "IBM Plex Mono",monospace;z-index:9}
@media (max-width:640px){#hint{display:none}#debug{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">loading Coupeville…</div>
<div class="hud" id="title">Coupeville<small id="subtitle">placeholder town · sprites pending</small></div>
<div class="hud" id="clock">--:--<small>Coupeville, WA</small></div>
<div class="hud" id="status"></div>
<div class="hud" id="hint">drag to pan · scroll or pinch to zoom · click a building</div>
<div id="card" hidden></div>
<div id="debug"><button id="live" aria-pressed="true">live clock</button><input type="range" id="tod" min="0" max="24" step="0.05" value="12"><span id="tod-o"></span></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
